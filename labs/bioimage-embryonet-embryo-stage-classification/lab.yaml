schema_version: '2.0'
package: bioimage-embryonet-embryo-stage-classification
version: 1.0.0
title: Bioimage Embryonet Base Lab
description: EmbryoNet embryo-stage classification from an imported BioImage.io ONNX
  graph. This lab exposes source-faithful ONNX runtime evidence without claiming scientific
  validity beyond the source artifact.
models:
- alias: bioimage_embryonet_embryo_stage_classification
  path: models/core
- alias: visualisation
  path: models/visualisation
wiring:
- from: bioimage_embryonet_embryo_stage_classification.embryo_development_scores
  to:
  - visualisation.embryo_development_scores
- from: bioimage_embryonet_embryo_stage_classification.prediction_summary
  to:
  - visualisation.prediction_summary
runtime:
  duration: 0.02
  communication_step: 0.01
  initial_inputs: {}
