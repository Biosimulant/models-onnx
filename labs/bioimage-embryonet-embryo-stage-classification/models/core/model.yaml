schema_version: '2.0'
title: Bioimage Embryonet Base
description: EmbryoNet Model by embryoNet Team
standard: onnx
tags:
- bioimage
- onnx
- classification
- resnet-18
- embryology
- onnx
- embryo
authors:
- Biosimulant Team
biosim:
  communication_step: 0.01
  entrypoint: src.imported_bioimage_model:BioimageEmbryonetBaseModel
  init_kwargs:
    model_path: artifacts/model.onnx
    image_input_name: data
    conv_time_input_name: t_for_conv
    fc_time_input_name: t_for_fc
    output_name: output
    image_shape:
    - 1
    - 3
    - 224
    - 224
    conv_time_shape:
    - 1
    - 1
    - 224
    - 224
    fc_time_shape:
    - 1
    - 1
    image_port: embryo_image
    conv_time_port: convolution_time_map
    fc_time_port: stage_time_scalar
    output_port: embryo_development_scores
    summary_port: prediction_summary
io:
  inputs:
  - name: embryo_image
    maps_to: data
    description: 'Inputs are already-preprocessed ONNX tensors: `data`, `t_for_conv`,
      and `t_for_fc`.'
  - name: convolution_time_map
    maps_to: t_for_conv
    description: 'Inputs are already-preprocessed ONNX tensors: `data`, `t_for_conv`,
      and `t_for_fc`.'
  - name: stage_time_scalar
    maps_to: t_for_fc
    description: 'Inputs are already-preprocessed ONNX tensors: `data`, `t_for_conv`,
      and `t_for_fc`.'
  outputs:
  - name: embryo_development_scores
    maps_to: output
    description: Compact tensor evidence derived from the source-derived ONNX graph output.
  - name: prediction_summary
    maps_to: output
    description: Compact summary derived from the ONNX graph output tensor.
runtime:
  dependencies:
    packages:
    - onnxruntime==1.22.1
onnx:
  task: classification
  model_file: artifacts/model.onnx
  inputs:
  - name: data
    dtype: float32
    shape:
    - 1
    - 3
    - 224
    - 224
  - name: t_for_conv
    dtype: float32
    shape:
    - 1
    - 1
    - 224
    - 224
  - name: t_for_fc
    dtype: float32
    shape:
    - 1
    - 1
  outputs:
  - name: output
    dtype: float32
    shape:
    - 14
license: GPL-3.0
source:
  rdf: https://bioimage-io.github.io/collection-bioimage-io/rdfs/10.5281/zenodo.7315440/7315441/rdf.yaml
  onnx: https://zenodo.org/api/records/7315441/files/EmbryoNet_GPU_batch_1.onnx/content
