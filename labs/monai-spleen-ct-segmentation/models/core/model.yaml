schema_version: '2.0'
title: Monai Spleen Ct Segmentation
description: Imported MONAI ONNX export for 3D spleen CT segmentation.
standard: onnx
tags:
- monai
- onnx
- ct
- segmentation
- imported
authors:
- Biosimulant Team
biosim:
  communication_step: 0.01
  entrypoint: src.imported_monai_model:MonaiSpleenCtSegmentation
  init_kwargs:
    model_path: artifacts/model.onnx
    model_input_name: image
    model_output_name: pred
    input_shape:
    - 1
    - 1
    - 96
    - 96
    - 96
    output_shape:
    - 1
    - 2
    - 96
    - 96
    - 96
    input_port: ct_volume
    output_port: segmentation_prediction_tensor
    summary_port: segmentation_summary
io:
  inputs:
  - name: ct_volume
    maps_to: image
    description: Input maps to ONNX graph input `image` and is a preprocessed CT volume
      tensor.
  outputs:
  - name: segmentation_prediction_tensor
    maps_to: pred
    description: Compact tensor evidence derived from the source-derived ONNX graph output.
  - name: segmentation_summary
    maps_to: pred
    description: Shape and value summary derived from the ONNX segmentation output
      tensor.
runtime:
  dependencies:
    packages:
    - onnxruntime==1.22.1
onnx:
  task: segmentation
  model_file: artifacts/model.onnx
  inputs:
  - name: image
    dtype: float32
    shape:
    - 1
    - 1
    - 96
    - 96
    - 96
  outputs:
  - name: pred
    dtype: float32
    shape:
    - 1
    - 2
    - 96
    - 96
    - 96
source:
  bundle: https://api.ngc.nvidia.com/v2/models/nvidia/monaihosting/spleen_ct_segmentation/versions/0.1.0/files/spleen_ct_segmentation_v0.1.0.zip
