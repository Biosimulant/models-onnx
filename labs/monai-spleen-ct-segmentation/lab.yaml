schema_version: '2.0'
title: Monai Spleen Ct Segmentation Lab
description: Spleen CT segmentation exported from a MONAI bundle. This lab exposes
  source-faithful ONNX runtime evidence without claiming scientific validity beyond
  the source artifact.
models:
- alias: monai_spleen_ct_segmentation
  path: models/core
- alias: visualisation
  path: models/visualisation
wiring:
- from: monai_spleen_ct_segmentation.segmentation_prediction_tensor
  to:
  - visualisation.segmentation_prediction_tensor
- from: monai_spleen_ct_segmentation.segmentation_summary
  to:
  - visualisation.segmentation_summary
runtime:
  duration: 0.02
  communication_step: 0.01
  initial_inputs: {}
