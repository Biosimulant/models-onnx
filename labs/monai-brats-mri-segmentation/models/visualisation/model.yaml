schema_version: '2.0'
title: Monai Brats Mri Segmentation Visualisation
description: Publication-facing visualisation for source-faithful ONNX runtime evidence.
standard: other
tags:
- onnx
- visualisation
- publish-ready
authors:
- Biosimulant Team
biosim:
  communication_step: 0.01
  entrypoint: src.onnx_visualisation:OnnxPublicationVisualisation
  init_kwargs:
    lab_title: Monai Brats Mri Segmentation
    source_type: MONAI ONNX export
    task: segmentation
    question: What segmentation prediction tensor does the source MONAI BRATS MRI
      ONNX export emit for this multimodal MRI volume tensor?
    answer_style: Report output tensor shape, channel count, and value statistics.
    caveat: Synthetic input validates ONNX execution only; clinical segmentation quality
      requires source validation data.
    dominant_module: MONAI BRATS MRI segmentation graph
    public_input_note: Input maps to ONNX graph input `image` and is a four-channel
      preprocessed MRI volume tensor.
    input_contracts:
    - name: image
      dtype: float32
      shape:
      - 1
      - 4
      - 128
      - 128
      - 128
    output_contracts:
    - name: pred
      dtype: float32
      shape:
      - 1
      - 3
      - 128
      - 128
      - 128
    visual_inputs:
      segmentation_prediction_tensor:
        payload: json
      segmentation_summary:
        mean_probability: float
        voxel_count: int
io:
  inputs:
  - name: segmentation_prediction_tensor
    description: Runtime evidence from core output `segmentation_prediction_tensor`.
  - name: segmentation_summary
    description: Runtime evidence from core output `segmentation_summary`.
  outputs: []
