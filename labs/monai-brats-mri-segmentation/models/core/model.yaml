schema_version: '2.0'
title: Monai Brats Mri Segmentation
description: Imported MONAI ONNX export for 3D BRATS multimodal MRI segmentation.
standard: onnx
tags:
- monai
- onnx
- mri
- segmentation
- imported
authors:
- Biosimulant Team
biosim:
  communication_step: 0.01
  entrypoint: src.imported_monai_model:MonaiBratsMriSegmentation
  init_kwargs:
    model_path: artifacts/model.onnx
    model_input_name: image
    model_output_name: pred
    input_shape:
    - 1
    - 4
    - 128
    - 128
    - 128
    output_shape:
    - 1
    - 3
    - 128
    - 128
    - 128
    input_port: multimodal_mri_volume
    output_port: segmentation_prediction_tensor
    summary_port: segmentation_summary
io:
  inputs:
  - name: multimodal_mri_volume
    maps_to: image
    description: Input maps to ONNX graph input `image` and is a four-channel preprocessed
      MRI volume tensor.
  outputs:
  - name: segmentation_prediction_tensor
    maps_to: pred
    description: Compact tensor evidence derived from the source-derived ONNX graph output.
  - name: segmentation_summary
    maps_to: pred
    description: Shape and value summary derived from the ONNX segmentation output
      tensor.
runtime:
  dependencies:
    packages:
    - onnxruntime==1.22.1
onnx:
  task: segmentation
  model_file: artifacts/model.onnx
  inputs:
  - name: image
    dtype: float32
    shape:
    - 1
    - 4
    - 128
    - 128
    - 128
  outputs:
  - name: pred
    dtype: float32
    shape:
    - 1
    - 3
    - 128
    - 128
    - 128
source:
  bundle: https://api.ngc.nvidia.com/v2/models/nvidia/monaihosting/brats_mri_segmentation/versions/0.1.0/files/brats_mri_segmentation_v0.1.0.zip
