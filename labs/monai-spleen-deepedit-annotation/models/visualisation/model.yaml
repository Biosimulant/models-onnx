schema_version: '2.0'
title: Monai Spleen Deepedit Annotation Visualisation
description: Publication-facing visualisation for source-faithful ONNX runtime evidence.
standard: other
tags:
- onnx
- visualisation
- publish-ready
authors:
- Biosimulant Team
biosim:
  communication_step: 0.01
  entrypoint: src.onnx_visualisation:OnnxPublicationVisualisation
  init_kwargs:
    lab_title: Monai Spleen Deepedit Annotation
    source_type: MONAI ONNX export
    task: annotation
    question: What annotation prediction tensor does the source MONAI DeepEdit ONNX
      export emit for this CT volume plus guidance-channel tensor?
    answer_style: Report output tensor shape, channel count, and value statistics.
    caveat: The three input channels include guidance channels from the source DeepEdit
      contract; synthetic input validates wiring only.
    dominant_module: MONAI DeepEdit annotation graph
    public_input_note: Input maps to ONNX graph input `image` and is a preprocessed
      CT volume with guidance channels.
    input_contracts:
    - name: image
      dtype: float32
      shape:
      - 1
      - 3
      - 128
      - 128
      - 128
    output_contracts:
    - name: pred
      dtype: float32
      shape:
      - 1
      - 2
      - 128
      - 128
      - 128
    visual_inputs:
      segmentation_prediction_tensor:
        payload: json
      segmentation_summary:
        mean_probability: float
        voxel_count: int
io:
  inputs:
  - name: segmentation_prediction_tensor
    description: Runtime evidence from core output `segmentation_prediction_tensor`.
  - name: segmentation_summary
    description: Runtime evidence from core output `segmentation_summary`.
  outputs: []
