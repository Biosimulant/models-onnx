schema_version: '2.0'
title: Hf Allenai Scibert Scivocab Uncased
description: Imported Hugging Face transformer ONNX export for SciBERT with token-level
  and pooled embedding outputs.
standard: onnx
tags:
- transformer
- onnx
- scientific-nlp
- imported
authors:
- Biosimulant Team
biosim:
  communication_step: 0.01
  entrypoint: src.imported_transformer_model:HfAllenaiScibertScivocabUncased
  init_kwargs:
    model_path: artifacts/model.onnx
    token_input_name: input_ids
    mask_input_name: attention_mask
    segment_input_name: token_type_ids
    sequence_output_name: last_hidden_state
    pooled_output_name: pooled_output
    seq_length: 16
    token_port: scientific_text_token_ids
    mask_port: scientific_text_attention_mask
io:
  inputs:
  - name: scientific_text_token_ids
    maps_to: input_ids
    description: Inputs map to ONNX `input_ids` and `attention_mask`; tokenizer preprocessing
      is not bundled.
  - name: scientific_text_attention_mask
    maps_to: attention_mask
    description: Inputs map to ONNX `input_ids` and `attention_mask`; tokenizer preprocessing
      is not bundled.
  outputs:
  - name: sequence_embeddings
    maps_to: last_hidden_state
    description: Compact embedding evidence derived from the source ONNX graph output.
  - name: pooled_embedding
    maps_to: pooled_output
    description: Compact embedding evidence derived from the source ONNX graph output.
runtime:
  dependencies:
    packages:
    - onnxruntime==1.22.1
onnx:
  task: embedding-generation
  model_file: artifacts/model.onnx
  inputs:
  - name: input_ids
    dtype: int64
    shape:
    - 1
    - 16
  - name: attention_mask
    dtype: int64
    shape:
    - 1
    - 16
  - name: token_type_ids
    dtype: int64
    shape:
    - 1
    - 16
  outputs:
  - name: last_hidden_state
    dtype: float32
    shape:
    - 1
    - 16
    - 768
  - name: pooled_output
    dtype: float32
    shape:
    - 1
    - 768
source:
  model: https://huggingface.co/allenai/scibert_scivocab_uncased
