schema_version: '2.0'
title: Bioimage Hpa Bestfitting Inceptionv3
description: The winning model of HPA image classification 2021 by Bestfitting
standard: onnx
tags:
- bioimage
- onnx
- classification
- inception-v3
- hpa
- onnx
- cells
authors:
- Biosimulant Team
biosim:
  communication_step: 0.01
  entrypoint: src.imported_bioimage_model:BioimageHpaBestfittingInceptionv3
  init_kwargs:
    model_path: artifacts/model.onnx
    input_shape:
    - 1
    - 4
    - 128
    - 128
    class_output_name: classes
    feature_output_name: features
    class_dim: 19
    feature_dim: 2048
    input_scale: 0.003921568627
    input_port: cell_image_tensor
    class_port: classification_scores
    feature_port: feature_embedding
    summary_port: prediction_summary
io:
  inputs:
  - name: cell_image_tensor
    maps_to: image
    description: Input maps to ONNX graph input `image` and is an already-preprocessed
      cell image tensor.
  outputs:
  - name: classification_scores
    maps_to: classes
    description: Compact tensor evidence derived from the source-derived ONNX graph output.
  - name: feature_embedding
    maps_to: features
    description: Compact embedding evidence derived from the source ONNX graph output.
  - name: prediction_summary
    maps_to: features
    description: Compact summary derived from the ONNX graph output tensor.
runtime:
  dependencies:
    packages:
    - onnxruntime==1.22.1
onnx:
  task: classification
  model_file: artifacts/model.onnx
  inputs:
  - name: image
    dtype: float32
    shape:
    - 1
    - 4
    - 128
    - 128
  outputs:
  - name: classes
    dtype: float32
    shape:
    - 1
    - 19
  - name: features
    dtype: float32
    shape:
    - 1
    - 2048
license: MIT
source:
  rdf: https://bioimage-io.github.io/collection-bioimage-io/rdfs/10.5281/zenodo.5910854/6539073/rdf.yaml
  onnx: https://zenodo.org/api/records/6539073/files/bestfitting-inceptionv3-single-cell.onnx/content
