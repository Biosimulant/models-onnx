schema_version: '2.0'
title: Hf Facebook Esm2 T68m Ur50d
description: Imported Hugging Face transformer ONNX export for ESM-2 t6 with token-level
  and pooled protein embeddings.
standard: onnx
tags:
- transformer
- onnx
- protein-language-model
- imported
authors:
- Biosimulant Team
biosim:
  communication_step: 0.01
  entrypoint: src.imported_transformer_model:HfFacebookEsm2T68mUr50d
  init_kwargs:
    model_path: artifacts/model.onnx
    token_input_name: input_ids
    mask_input_name: attention_mask
    sequence_output_name: last_hidden_state
    pooled_output_name: pooled_output
    seq_length: 16
    token_port: protein_sequence_token_ids
    mask_port: protein_sequence_attention_mask
io:
  inputs:
  - name: protein_sequence_token_ids
    maps_to: input_ids
    description: Inputs map to ONNX `input_ids` and `attention_mask`; sequence tokenization
      is not bundled.
  - name: protein_sequence_attention_mask
    maps_to: attention_mask
    description: Inputs map to ONNX `input_ids` and `attention_mask`; sequence tokenization
      is not bundled.
  outputs:
  - name: sequence_embeddings
    maps_to: last_hidden_state
    description: Compact embedding evidence derived from the source ONNX graph output.
  - name: pooled_embedding
    maps_to: pooled_output
    description: Compact embedding evidence derived from the source ONNX graph output.
runtime:
  dependencies:
    packages:
    - onnxruntime==1.22.1
onnx:
  task: embedding-generation
  model_file: artifacts/model.onnx
  inputs:
  - name: input_ids
    dtype: int64
    shape:
    - batch
    - sequence
  - name: attention_mask
    dtype: int64
    shape:
    - batch
    - sequence
  outputs:
  - name: last_hidden_state
    dtype: float32
    shape:
    - batch
    - sequence
    - 320
  - name: pooled_output
    dtype: float32
    shape:
    - batch
    - 320
source:
  model: https://huggingface.co/facebook/esm2_t6_8M_UR50D
