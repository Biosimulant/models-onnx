schema_version: "2.0"
title: "MONAI: MonaiSpleenDeepeditAnnotation"
description: "Imported MONAI ONNX export for 3D spleen DeepEdit annotation."
standard: onnx
tags: [monai, onnx, medical-imaging, annotation, imported]
authors: ["Biosimulant Team"]
biosim:
  entrypoint: "src.imported_monai_model:MonaiSpleenDeepeditAnnotation"
  init_kwargs:
    model_path: "artifacts/model.onnx"
    model_input_name: "image"
    model_output_name: "pred"
    input_shape: [1, 3, 128, 128, 128]
    output_shape: [1, 2, 128, 128, 128]
io:
  inputs:
    - volume_tensor
  outputs:
    - class_probabilities
    - segmentation_summary
runtime:
  dependencies:
    packages:
      - onnxruntime==1.22.1
onnx:
  task: annotation
  model_file: "artifacts/model.onnx"
  inputs:
    - name: image
      dtype: float32
      shape: [1, 3, 128, 128, 128]
  outputs:
    - name: pred
      dtype: float32
      shape: [1, 2, 128, 128, 128]
source:
  bundle: "https://api.ngc.nvidia.com/v2/models/nvidia/monaihosting/spleen_deepedit_annotation/versions/0.1.0/files/spleen_deepedit_annotation_v0.1.0.zip"
