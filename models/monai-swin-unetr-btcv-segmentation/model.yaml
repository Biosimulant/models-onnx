schema_version: "2.0"
title: "MONAI: MonaiSwinUnetrBtcvSegmentation"
description: "Imported MONAI ONNX export for 3D BTCV Swin UNETR segmentation."
standard: onnx
tags: [monai, onnx, medical-imaging, segmentation, imported]
authors: ["Biosimulant Team"]
biosim:
  entrypoint: "src.imported_monai_model:MonaiSwinUnetrBtcvSegmentation"
  init_kwargs:
    model_path: "artifacts/model.onnx"
    model_input_name: "image"
    model_output_name: "pred"
    input_shape: [1, 1, 96, 96, 96]
    output_shape: [1, 14, 96, 96, 96]
io:
  inputs:
    - volume_tensor
  outputs:
    - class_probabilities
    - segmentation_summary
runtime:
  dependencies:
    packages:
      - onnxruntime==1.22.1
onnx:
  task: segmentation
  model_file: "artifacts/model.onnx"
  inputs:
    - name: image
      dtype: float32
      shape: [1, 1, 96, 96, 96]
  outputs:
    - name: pred
      dtype: float32
      shape: [1, 14, 96, 96, 96]
source:
  bundle: "https://api.ngc.nvidia.com/v2/models/nvidia/monaihosting/swin_unetr_btcv_segmentation/versions/0.1.0/files/swin_unetr_btcv_segmentation_v0.1.0.zip"
