schema_version: "2.0"
title: "BioImage: BioimageHpaBestfittingInceptionv3"
description: "The winning model of HPA image classification 2021 by Bestfitting"
standard: onnx
tags: [bioimage, onnx, classification, inception-v3, hpa, onnx, cells]
authors: ["Biosimulant Team"]
biosim:
  entrypoint: "src.imported_bioimage_model:BioimageHpaBestfittingInceptionv3"
  init_kwargs:
    model_path: "artifacts/model.onnx"
    input_shape: [1, 4, 128, 128]
    class_output_name: "classes"
    feature_output_name: "features"
    class_dim: 19
    feature_dim: 2048
    input_scale: 0.003921568627
io:
  inputs:
    - image
  outputs:
    - class_probabilities
    - feature_embeddings
    - prediction_summary
runtime:
  dependencies:
    packages:
      - onnxruntime==1.22.1
onnx:
  task: classification
  model_file: "artifacts/model.onnx"
  inputs:
    - name: image
      dtype: float32
      shape: [1, 4, 128, 128]
  outputs:
    - name: classes
      dtype: float32
      shape: [1, 19]
    - name: features
      dtype: float32
      shape: [1, 2048]
license: MIT
source:
  rdf: "https://bioimage-io.github.io/collection-bioimage-io/rdfs/10.5281/zenodo.5910854/6539073/rdf.yaml"
  onnx: "https://zenodo.org/api/records/6539073/files/bestfitting-inceptionv3-single-cell.onnx/content"
