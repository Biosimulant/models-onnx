schema_version: "2.0"
title: "BioImage: BioimageEmbryonetBaseModel"
description: "EmbryoNet Model by embryoNet Team"
standard: onnx
tags: [bioimage, onnx, classification, resnet-18, embryology, onnx, embryo]
authors: ["Biosimulant Team"]
biosim:
  entrypoint: "src.imported_bioimage_model:BioimageEmbryonetBaseModel"
  init_kwargs:
    model_path: "artifacts/model.onnx"
    image_input_name: "data"
    conv_time_input_name: "t_for_conv"
    fc_time_input_name: "t_for_fc"
    output_name: "output"
    image_shape: [1, 3, 224, 224]
    conv_time_shape: [1, 1, 224, 224]
    fc_time_shape: [1, 1]
io:
  inputs:
    - image
    - conv_time_map
    - fc_time_scalar
  outputs:
    - development_scores
    - prediction_summary
runtime:
  dependencies:
    packages:
      - onnxruntime==1.22.1
onnx:
  task: classification
  model_file: "artifacts/model.onnx"
  inputs:
    - name: data
      dtype: float32
      shape: [1, 3, 224, 224]
    - name: t_for_conv
      dtype: float32
      shape: [1, 1, 224, 224]
    - name: t_for_fc
      dtype: float32
      shape: [1, 1]
  outputs:
    - name: output
      dtype: float32
      shape: [14]
license: GPL-3.0
source:
  rdf: "https://bioimage-io.github.io/collection-bioimage-io/rdfs/10.5281/zenodo.7315440/7315441/rdf.yaml"
  onnx: "https://zenodo.org/api/records/7315441/files/EmbryoNet_GPU_batch_1.onnx/content"
