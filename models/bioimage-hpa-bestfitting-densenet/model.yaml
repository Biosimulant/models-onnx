schema_version: "2.0"
title: "Bioimage Hpa Bestfitting Densenet"
description: "The winning model of HPA image classification 2019 by Bestfitting"
standard: onnx
tags: [bioimage, onnx, classification, densenet-121, hpa, onnx, cells]
authors: ["Biosimulant Team"]
biosim:
  entrypoint: "src.imported_bioimage_model:BioimageHpaBestfittingDensenet"
  init_kwargs:
    model_path: "artifacts/model.onnx"
    input_shape: [1, 4, 1024, 1024]
    class_output_name: "classes"
    feature_output_name: "features"
    class_dim: 28
    feature_dim: 1024
    input_scale: 0.003921568627
io:
  inputs:
    - image
  outputs:
    - class_probabilities
    - feature_embeddings
    - prediction_summary
runtime:
  dependencies:
    packages:
      - onnxruntime==1.22.1
onnx:
  task: classification
  model_file: "artifacts/model.onnx"
  inputs:
    - name: image
      dtype: float32
      shape: [1, 4, 1024, 1024]
  outputs:
    - name: classes
      dtype: float32
      shape: [1, 28]
    - name: features
      dtype: float32
      shape: [1, 1024]
license: MIT
source:
  rdf: "https://bioimage-io.github.io/collection-bioimage-io/rdfs/10.5281/zenodo.5910163/5942853/rdf.yaml"
  onnx: "https://zenodo.org/api/records/5942853/files/densenet_model.onnx/content"
