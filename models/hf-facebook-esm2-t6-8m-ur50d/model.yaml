schema_version: "2.0"
title: "Hf Facebook Esm2 T68m Ur50d"
description: "Imported Hugging Face transformer ONNX export for ESM-2 t6 with token-level and pooled protein embeddings."
standard: onnx
tags: [transformer, onnx, protein-language-model, imported]
authors: ["Biosimulant Team"]
biosim:
  entrypoint: "src.imported_transformer_model:HfFacebookEsm2T68mUr50d"
  init_kwargs:
    model_path: "artifacts/model.onnx"
    token_input_name: "input_ids"
    mask_input_name: "attention_mask"
    sequence_output_name: "last_hidden_state"
    pooled_output_name: "pooled_output"
    seq_length: 16
io:
  inputs:
    - token_ids
    - attention_mask
  outputs:
    - sequence_embeddings
    - pooled_embedding
runtime:
  dependencies:
    packages:
      - onnxruntime==1.22.1
onnx:
  task: embedding-generation
  model_file: "artifacts/model.onnx"
  inputs:
    - name: input_ids
      dtype: int64
      shape: ["batch", "sequence"]
    - name: attention_mask
      dtype: int64
      shape: ["batch", "sequence"]
  outputs:
    - name: last_hidden_state
      dtype: float32
      shape: ["batch", "sequence", 320]
    - name: pooled_output
      dtype: float32
      shape: ["batch", 320]
source:
  model: "https://huggingface.co/facebook/esm2_t6_8M_UR50D"
