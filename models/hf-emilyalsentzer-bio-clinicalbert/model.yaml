schema_version: "2.0"
title: "Hf Emilyalsentzer Bio Clinicalbert"
description: "Imported Hugging Face transformer ONNX export for Bio_ClinicalBERT with token-level and pooled embedding outputs."
standard: onnx
tags: [transformer, onnx, clinical-nlp, imported]
authors: ["Biosimulant Team"]
biosim:
  entrypoint: "src.imported_transformer_model:HfEmilyalsentzerBioClinicalbert"
  init_kwargs:
    model_path: "artifacts/model.onnx"
    token_input_name: "input_ids"
    mask_input_name: "attention_mask"
    segment_input_name: "token_type_ids"
    sequence_output_name: "last_hidden_state"
    pooled_output_name: "pooled_output"
    seq_length: 16
io:
  inputs:
    - token_ids
    - attention_mask
  outputs:
    - sequence_embeddings
    - pooled_embedding
runtime:
  dependencies:
    packages:
      - onnxruntime==1.22.1
onnx:
  task: embedding-generation
  model_file: "artifacts/model.onnx"
  inputs:
    - name: input_ids
      dtype: int64
      shape: [1, 16]
    - name: attention_mask
      dtype: int64
      shape: [1, 16]
    - name: token_type_ids
      dtype: int64
      shape: [1, 16]
  outputs:
    - name: last_hidden_state
      dtype: float32
      shape: [1, 16, 768]
    - name: pooled_output
      dtype: float32
      shape: [1, 768]
source:
  model: "https://huggingface.co/emilyalsentzer/Bio_ClinicalBERT"
